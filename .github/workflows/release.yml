name: Build release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check tag and build packages
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match Directory.Build.props.' }
          ./scripts/release.ps1
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $assets = Get-ChildItem "artifacts/releases/$version" -File | Select-Object -ExpandProperty FullName
          $options = @('--draft', '--verify-tag', '--title', "LimitBar $version", '--notes-file', 'CHANGELOG.md')
          if ($version.Contains('-')) { $options += '--prerelease' }
          gh release create "v$version" @assets @options
          if ($LASTEXITCODE) { throw 'Release creation failed.' }
